<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#1b2a21" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b3d2e">Saha+ – Medical Map · Use Case Diagram</text>

  <!-- System boundary -->
  <rect x="190" y="60" width="820" height="700" rx="14" fill="#f3faf5" stroke="#147a4d" stroke-width="2"/>
  <text x="206" y="84" font-size="13" font-weight="bold" fill="#147a4d">System boundary: Saha+ (Medical Map module – Tunisia only)</text>

  <!-- ===== Actor/use-case associations ===== -->
  <g stroke="#0b3d2e" stroke-width="1.2">
    <line x1="92" y1="415" x2="245" y2="300"/>
    <line x1="92" y1="415" x2="245" y2="530"/>
    <line x1="1088" y1="415" x2="955" y2="190"/>
    <line x1="1088" y1="415" x2="955" y2="470"/>
  </g>

  <!-- ===== Visitor use cases ===== -->
  <g stroke="#14a05f" stroke-width="1.5" fill="#e4f5ea">
    <ellipse cx="340" cy="300" rx="95" ry="32"/>
    <ellipse cx="340" cy="530" rx="95" ry="32"/>
    <ellipse cx="600" cy="170" rx="100" ry="32"/>
    <ellipse cx="600" cy="300" rx="100" ry="32"/>
    <ellipse cx="600" cy="430" rx="100" ry="32"/>
  </g>
  <g font-size="13" fill="#1b2a21" text-anchor="middle">
    <text x="340" y="296">View map</text><text x="340" y="312">of Tunisia</text>
    <text x="340" y="526">View facility details</text><text x="340" y="542">(and its doctors)</text>
    <text x="600" y="166">Search doctors</text><text x="600" y="182">by specialty</text>
    <text x="600" y="296">Filter by</text><text x="600" y="312">facility type</text>
    <text x="600" y="426">Filter by</text><text x="600" y="442">governorate / city</text>
  </g>

  <!-- extend arrows (point to the extended use case) -->
  <g stroke="#1b2a21" stroke-width="1.2" stroke-dasharray="6 4" fill="none">
    <line x1="508" y1="184" x2="418" y2="280" marker-end="url(#open)"/>
    <line x1="500" y1="300" x2="437" y2="300" marker-end="url(#open)"/>
    <line x1="508" y1="416" x2="418" y2="320" marker-end="url(#open)"/>
    <line x1="340" y1="498" x2="340" y2="334" marker-end="url(#open)"/>
  </g>
  <g font-size="11" font-style="italic" fill="#1b2a21">
    <text x="440" y="222">«extend»</text>
    <text x="446" y="292">«extend»</text>
    <text x="440" y="388">«extend»</text>
    <text x="350" y="420">«extend»</text>
  </g>

  <!-- ===== Admin use cases ===== -->
  <g stroke="#14a05f" stroke-width="1.5" fill="#e4f5ea">
    <ellipse cx="860" cy="190" rx="95" ry="32"/>
    <ellipse cx="860" cy="470" rx="95" ry="32"/>
  </g>
  <g stroke="#147a4d" stroke-width="1.5" fill="#ffffff">
    <ellipse cx="860" cy="320" rx="95" ry="32"/>
    <ellipse cx="860" cy="600" rx="95" ry="32"/>
  </g>
  <g font-size="13" fill="#1b2a21" text-anchor="middle">
    <text x="860" y="186">Manage facilities</text><text x="860" y="202">(CRUD)</text>
    <text x="860" y="316">Validate location</text><text x="860" y="332">within Tunisia</text>
    <text x="860" y="466">Manage doctors</text><text x="860" y="482">(CRUD)</text>
    <text x="860" y="596">Assign doctor</text><text x="860" y="612">to one facility</text>
  </g>
  <g stroke="#1b2a21" stroke-width="1.2" stroke-dasharray="6 4" fill="none">
    <line x1="860" y1="222" x2="860" y2="286" marker-end="url(#open)"/>
    <line x1="860" y1="502" x2="860" y2="566" marker-end="url(#open)"/>
  </g>
  <g font-size="11" font-style="italic" fill="#1b2a21">
    <text x="870" y="258">«include»</text>
    <text x="870" y="538">«include»</text>
  </g>

  <!-- ===== Actors ===== -->
  <g stroke="#0b3d2e" stroke-width="2" fill="none">
    <circle cx="75" cy="392" r="10"/><path d="M75 402 V438 M58 414 H92 M75 438 L62 460 M75 438 L88 460"/>
    <circle cx="1105" cy="392" r="10"/><path d="M1105 402 V438 M1088 414 H1122 M1105 438 L1092 460 M1105 438 L1118 460"/>
  </g>
  <text x="75" y="482" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b3d2e">Visitor</text>
  <text x="1105" y="482" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b3d2e">Admin</text>

  <!-- Legend -->
  <line x1="206" y1="735" x2="236" y2="735" stroke="#0b3d2e" stroke-width="1.2"/>
  <text x="242" y="739" font-size="11" fill="#44574b">Association</text>
  <line x1="330" y1="735" x2="360" y2="735" stroke="#1b2a21" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="368" y="739" font-size="11" fill="#44574b">«include» / «extend» – arrow points to the included / extended use case</text>

  <text x="600" y="786" text-anchor="middle" font-size="11" fill="#44574b">PW – 2A8 · Esprit School of Engineering – Tunisia · Academic Year 2026–2027</text>
</svg>
