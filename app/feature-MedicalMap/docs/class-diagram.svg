<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="1210" height="640" fill="#ffffff"/>
  <text x="605" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b3d2e">Saha+ – Medical Map · Class Diagram (app/Models)</text>

  <!-- ===== Facility ===== -->
  <g>
    <rect x="40" y="60" width="330" height="442" rx="6" fill="#ffffff" stroke="#0b3d2e" stroke-width="1.5"/>
    <path d="M40 94 V66 a6 6 0 0 1 6 -6 H364 a6 6 0 0 1 6 6 V94 Z" fill="#14a05f" stroke="#0b3d2e" stroke-width="1.5"/>
    <text x="205" y="83" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Facility</text>
    <g font-family="Courier New, monospace" font-size="12" fill="#1b2a21">
      <text x="52" y="116">-id: int</text>
      <text x="52" y="136">-name: string</text>
      <text x="52" y="156">-type: FacilityType</text>
      <text x="52" y="176">-address: string</text>
      <text x="52" y="196">-city: string</text>
      <text x="52" y="216">-governorate: string // 1 of 24</text>
      <text x="52" y="236">-latitude: float</text>
      <text x="52" y="256">-longitude: float</text>
      <text x="52" y="276">-phone: ?string</text>
      <text x="52" y="296">-emergencyStatus: bool</text>
      <text x="52" y="316">-isDemo: bool</text>
    </g>
    <line x1="40" y1="328" x2="370" y2="328" stroke="#0b3d2e" stroke-width="1"/>
    <g font-family="Courier New, monospace" font-size="12" fill="#1b2a21" text-decoration="underline">
      <text x="52" y="348">+all(): Facility[]</text>
      <text x="52" y="368">+find(id: int): ?Facility</text>
      <text x="52" y="388">+search(filters: array): Facility[]</text>
      <text x="52" y="408">+validate(input: array): array</text>
      <text x="52" y="428">+create(data: array): int</text>
      <text x="52" y="448">+update(id: int, data: array): void</text>
      <text x="52" y="468">+delete(id: int): void</text>
    </g>
    <text x="52" y="488" font-family="Courier New, monospace" font-size="12" fill="#1b2a21">+doctors(): Doctor[]</text>
  </g>

  <!-- ===== Doctor ===== -->
  <g>
    <rect x="840" y="60" width="330" height="340" rx="6" fill="#ffffff" stroke="#0b3d2e" stroke-width="1.5"/>
    <path d="M840 94 V66 a6 6 0 0 1 6 -6 H1164 a6 6 0 0 1 6 6 V94 Z" fill="#14a05f" stroke="#0b3d2e" stroke-width="1.5"/>
    <text x="1005" y="83" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Doctor</text>
    <g font-family="Courier New, monospace" font-size="12" fill="#1b2a21">
      <text x="852" y="116">-id: int</text>
      <text x="852" y="136">-firstName: string</text>
      <text x="852" y="156">-lastName: string</text>
      <text x="852" y="176">-specialty: string</text>
      <text x="852" y="196">-phone: ?string</text>
      <text x="852" y="216">-email: ?string</text>
      <text x="852" y="236">-facilityId: int</text>
    </g>
    <line x1="840" y1="248" x2="1170" y2="248" stroke="#0b3d2e" stroke-width="1"/>
    <g font-family="Courier New, monospace" font-size="12" fill="#1b2a21" text-decoration="underline">
      <text x="852" y="268">+all(): Doctor[]</text>
      <text x="852" y="288">+byFacility(facilityId: int): Doctor[]</text>
      <text x="852" y="308">+find(id: int): ?Doctor</text>
      <text x="852" y="328">+validate(input: array): array</text>
      <text x="852" y="348">+create(data: array): int</text>
      <text x="852" y="368">+update(id: int, data: array): void</text>
      <text x="852" y="388">+delete(id: int): void</text>
    </g>
  </g>

  <!-- ===== Association Facility 1 — 0..* Doctor ===== -->
  <line x1="370" y1="150" x2="840" y2="150" stroke="#0b3d2e" stroke-width="1.5"/>
  <text x="605" y="141" text-anchor="middle" font-size="12" font-style="italic" fill="#1b2a21">employs</text>
  <text x="380" y="168" font-size="12" fill="#1b2a21">1</text>
  <text x="806" y="168" font-size="12" fill="#1b2a21">0..*</text>

  <!-- ===== FacilityType enumeration ===== -->
  <g transform="translate(400 -200)">
    <rect x="40" y="450" width="330" height="130" rx="6" fill="#ffffff" stroke="#0b3d2e" stroke-width="1.5"/>
    <path d="M40 496 V456 a6 6 0 0 1 6 -6 H364 a6 6 0 0 1 6 6 V496 Z" fill="#f0a202" stroke="#0b3d2e" stroke-width="1.5"/>
    <text x="205" y="467" text-anchor="middle" font-size="11" fill="#1b2a21">«enumeration»</text>
    <text x="205" y="487" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a21">FacilityType</text>
    <g font-family="Courier New, monospace" font-size="12" fill="#1b2a21">
      <text x="52" y="518">HOSPITAL</text>
      <text x="52" y="538">CLINIC</text>
      <text x="52" y="558">DONATION_CENTER</text>
    </g>
  </g>

  <!-- ===== Notes ===== -->
  <g>
    <rect x="840" y="410" width="330" height="170" rx="6" fill="#fdf6dc" stroke="#e0a100" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="852" y="432" font-size="12" font-weight="bold" fill="#1b2a21">Notes</text>
    <g font-size="12" fill="#1b2a21">
      <text x="852" y="452">• Scope is Tunisia only: latitude / longitude must</text>
      <text x="852" y="468">  fall inside Tunisia and governorate is one of the</text>
      <text x="852" y="484">  24 Tunisian governorates.</text>
      <text x="852" y="504">• A doctor belongs to exactly one facility;</text>
      <text x="852" y="520">  a facility has zero or many doctors.</text>
      <text x="852" y="540">• isDemo marks fictional sample data, kept apart</text>
      <text x="852" y="556">  from verified real-world data.</text>
      <text x="852" y="572">• Models read from MySQL through PDO.</text>
    </g>
  </g>

  <text x="605" y="620" text-anchor="middle" font-size="11" fill="#44574b">PW – 2A8 · Esprit School of Engineering – Tunisia · Academic Year 2026–2027 · underlined = static method</text>
</svg>
